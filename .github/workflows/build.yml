name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Ekstrak zip (jika ada) dan build
        run: |
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Zip ditemukan: $ZIP"
            unzip -q -o "$ZIP" -d _src
          fi
          GRADLE=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$GRADLE" ]; then
            echo "build.gradle tidak ditemukan. Upload powerstones-mod.zip ke repository."
            exit 1
          fi
          echo "Build di: $(dirname "$GRADLE")"
          cd "$(dirname "$GRADLE")"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: powerstones-jar
          path: "**/build/libs/*.jar"
